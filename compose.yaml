services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8081:81"
      - "8082:82"
    volumes:
      - ./configs/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      grafana-probe:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: stock-analysis-postgres
    build:
      context: .
      dockerfile: configs/docker/postgres.Dockerfile
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_DB: ${DATABASE_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-p",
          "5432",
          "-U",
          "${DATABASE_USER}",
          "-d",
          "${DATABASE_DB}",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command:
      - server
      - --console-address
      - :9001
      - /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.2.4-alpine3.22
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: stock-analysis-migrate
    build:
      context: .
      dockerfile: configs/docker/migrate.Dockerfile
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_DB: ${DATABASE_DB}
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      LANGFUSE_DB_USER: ${LANGFUSE_DB_USER}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      LANGFUSE_DB_NAME: ${LANGFUSE_DB_NAME}
      LANGFUSE_S3_BUCKET: ${LANGFUSE_S3_BUCKET}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

  api:
    image: stock-analysis-api
    build:
      context: .
      dockerfile: configs/docker/api.Dockerfile
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
      METRICS_PORT: "9464"
      MCP_HOST: mcp
      MCP_PORT: "8000"
      MONITORING_HOST: alloy
      MONITORING_PORT: "4317"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      alloy-probe:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: stock-analysis-worker
    build:
      context: .
      dockerfile: configs/docker/worker.Dockerfile
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_DB: ${DATABASE_DB}
      BATCH_SIZE: ${BATCH_SIZE}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS}
      WORKER_METRICS_PORT: "9464"
      MONITORING_HOST: alloy
      MONITORING_PORT: "4317"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
      alloy-probe:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "./scripts/check_pgq.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  mcp:
    image: stock-analysis-mcp
    build:
      context: .
      dockerfile: configs/docker/mcp.Dockerfile
    environment:
      BACKEND_HOST: api
      BACKEND_PORT: "8000"
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_METRICS_PORT: "9464"
      MONITORING_HOST: alloy
      MONITORING_PORT: "4317"
      OTEL_SERVICE_NAME: stock-analysis-mcp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      alloy-probe:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    image: stock-analysis-web
    build:
      context: .
      dockerfile: configs/docker/web.Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  eval:
    profiles: ["eval"]
    image: stock-analysis-eval
    build:
      context: .
      dockerfile: configs/docker/eval.Dockerfile
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_DB: ${DATABASE_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MCP_HOST: mcp
      MCP_PORT: "8000"
      MONITORING_HOST: alloy
      MONITORING_PORT: "4317"
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      DEEPEVAL_CACHE_FOLDER: /app/.deepeval
      TEST_POSTGRES_IMAGE: stock-analysis-postgres
      DOCKER_HOST: unix:///var/run/docker.sock
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - deepeval_cache:/app/.deepeval
    restart: "no"

  grafana:
    image: grafana/grafana:12.4.0-22081664032
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: "http://127.0.0.1:8081"
      GF_SERVER_SERVE_FROM_SUB_PATH: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/docker/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus-probe:
        condition: service_healthy
      loki-probe:
        condition: service_healthy
      tempo-probe:
        condition: service_healthy

  grafana-probe:
    image: curlimages/curl:8.18.0
    command:
      - sh
      - -c
      - sleep infinity
    depends_on:
      grafana:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://grafana:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.9.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./configs/docker/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    depends_on:
      blackbox-probe:
        condition: service_healthy

  blackbox:
    image: prom/blackbox-exporter:master
    command:
      - "--config.file=/etc/blackbox/blackbox.yaml"
    volumes:
      - ./configs/docker/blackbox.yaml:/etc/blackbox/blackbox.yaml:ro

  blackbox-probe:
    image: curlimages/curl:8.18.0
    command:
      - sh
      - -c
      - sleep infinity
    depends_on:
      blackbox:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://blackbox:9115/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 20

  prometheus-probe:
    image: curlimages/curl:8.18.0
    command:
      - sh
      - -c
      - sleep infinity
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://prometheus:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 20

  loki:
    image: grafana/loki:main-b9a0a15
    command:
      - -config.file=/etc/loki/loki.yaml
    volumes:
      - ./configs/docker/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki

  loki-probe:
    image: curlimages/curl:8.18.0
    command:
      - sh
      - -c
      - sleep infinity
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://loki:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  tempo-init:
    image: busybox:stable-musl
    user: "0:0"
    command:
      - chown
      - -R
      - 10001:10001
      - /tmp/tempo
    volumes:
      - tempo_data:/tmp/tempo
    restart: "no"

  tempo:
    image: grafana/tempo:main-c216472-${ARCH}
    command:
      - -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./configs/docker/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully

  tempo-probe:
    image: curlimages/curl:8.18.0
    command:
      - sh
      - -c
      - sleep infinity
    depends_on:
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://tempo:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  alloy:
    image: grafana/alloy:v1.13.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./configs/docker/config.alloy:/etc/alloy/config.alloy:ro
    environment:
      LANGFUSE_OTLP_ENDPOINT: ${LANGFUSE_OTLP_ENDPOINT}
      LANGFUSE_OTLP_AUTH_HEADER: ${LANGFUSE_OTLP_AUTH_HEADER}
    depends_on:
      loki-probe:
        condition: service_healthy
      prometheus-probe:
        condition: service_healthy
      tempo-probe:
        condition: service_healthy

  alloy-probe:
    image: curlimages/curl:8.18.0
    command:
      - sh
      - -c
      - sleep infinity
    depends_on:
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://alloy:12345/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.12.5-alpine
    restart: always
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse_env
      HOSTNAME: 0.0.0.0
      PORT: 3030
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL}
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER}:${LANGFUSE_DB_PASSWORD}@postgres:5432/${LANGFUSE_DB_NAME}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: true
      CLICKHOUSE_CLUSTER_ENABLED: false
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: true
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_USER}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: true
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3030/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  langfuse-web:
    image: langfuse/langfuse:3
    restart: always
    depends_on:
      langfuse-worker:
        condition: service_healthy
    environment:
      <<: *langfuse_env
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
  minio_data:
  redis_data:
  grafana_data:
  prometheus_data:
  loki_data:
  tempo_data:
  clickhouse_data:
  clickhouse_logs:
  deepeval_cache:
