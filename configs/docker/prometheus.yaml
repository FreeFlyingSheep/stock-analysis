global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:9464"]

  - job_name: mcp
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp:9464"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9464"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: blackbox-http
    scrape_interval: 30s
    scrape_timeout: 15s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:8000/health
          - http://mcp:8000/health
          - http://web:3000/health
          - http://nginx/
          - http://grafana:3000/api/health
          - http://loki:3100/ready
          - http://tempo:3200/ready
          - http://minio:9000/minio/health/live
          - http://alloy:12345/-/ready
          - http://prometheus:9090/-/healthy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox-tcp
    scrape_interval: 30s
    scrape_timeout: 15s
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - postgres:5432
          - redis:6379
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
